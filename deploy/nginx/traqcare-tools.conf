# TraqCare Tools - nginx reverse proxy
# Proxies all traffic to the Express server (frontend + API + SSE) on localhost:8787.
#
# Install:
#   sudo cp deploy/nginx/traqcare-tools.conf /etc/nginx/sites-available/traqcare-tools
#   sudo ln -s /etc/nginx/sites-available/traqcare-tools /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default   # remove the default welcome page
#   sudo nginx -t && sudo systemctl reload nginx

upstream traqcare_tools_backend {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    # Catch-all: responds on the server's IP out of the box.
    # Replace `_` with your domain (e.g. tools.example.com) once DNS is pointed here.
    server_name _;

    # Allow large request bodies (e.g. FCM payloads, API tester bodies).
    client_max_body_size 10m;

    # ---- Server-Sent Events: TCP live stream ----
    # SSE must NOT be buffered or it will appear to "hang" with no live data.
    location ~ ^/api/tcp/stream/ {
        proxy_pass http://traqcare_tools_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical for SSE:
        proxy_set_header Connection '';      # no keep-alive upgrade; stream stays open
        proxy_buffering off;                 # flush events to the client immediately
        proxy_cache off;
        proxy_read_timeout 3600s;            # keep the stream open (heartbeat is every 15s)
        chunked_transfer_encoding off;
        add_header X-Accel-Buffering no;     # belt-and-suspenders: disable nginx buffering
    }

    # ---- Everything else: frontend static files + JSON API ----
    location / {
        proxy_pass http://traqcare_tools_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---- Long-cache hashed static assets ----
    location /assets/ {
        proxy_pass http://traqcare_tools_backend;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
